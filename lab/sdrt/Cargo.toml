# open-sbsar: the library (src/lib.rs) and the sdrt command-line tool (src/main.rs).
[package]
name = "open-sbsar"
version = "0.1.0"
edition = "2024"
description = "A clean-room engine for compiled Substance archives (.sbsar)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wtfmydarling/open-sbsar"
readme = "../../README.md"
keywords = ["substance", "sbsar", "procedural", "texture", "material"]
categories = ["graphics", "rendering", "multimedia::images"]
exclude = ["GPU.md"]

[lib]
name = "open_sbsar"
path = "src/lib.rs"

[[bin]]
name = "sdrt"
path = "src/main.rs"

[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "exr"] }
rayon = "1.12"
roxmltree = "0.21.2"
crc32fast = "1.5"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "optimization"] }

[profile.release]
debug = 1

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# research probes (src/bin): not built for users
research = ["gpu"]

# research probe (lab/sdrt/src/bin/gpu_fma.rs): only with the Vulkan backend
[[bin]]
name = "gpu_fma"
path = "src/bin/gpu_fma.rs"
required-features = ["research"]

# research probe: the prelude's correctly rounded helpers against the CPU's
[[bin]]
name = "gpu_exact_probe"
path = "src/bin/gpu_exact_probe.rs"
required-features = ["research"]

# the examples use the GPU path (Renderer::new_gpu / with_device)
[[example]]
name = "render"
required-features = ["gpu"]

[[example]]
name = "host_device"
required-features = ["gpu"]

[[example]]
name = "incremental_check"
required-features = ["gpu"]

[dependencies.wgpu]
version = "30"
optional = true
features = ["wgsl"]

[dependencies.pollster]
version = "0.3"
optional = true

[dependencies.bytemuck]
version = "1"
optional = true
