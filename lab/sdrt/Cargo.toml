# sdrt: the open-sbsar engine for compiled Substance programs (.sbsasm): a CPU reference path
# and an optional Vulkan backend (--features gpu).
[package]
name = "sdrt"
version = "0.0.0"
edition = "2024"
description = "A clean-room engine for compiled Substance archives (.sbsar)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wtfmydarling/open-sbsar"
publish = false

[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
rayon = "1.12"

[profile.release]
debug = 1

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

# research probe (lab/sdrt/src/bin/gpu_fma.rs): only with the Vulkan backend
[[bin]]
name = "gpu_fma"
path = "src/bin/gpu_fma.rs"
required-features = ["gpu"]

# research probe: the prelude's correctly rounded helpers against the CPU's
[[bin]]
name = "gpu_exact_probe"
path = "src/bin/gpu_exact_probe.rs"
required-features = ["gpu"]

[dependencies.wgpu]
version = "0.19.4"
optional = true
features = ["wgsl"]

[dependencies.pollster]
version = "0.3"
optional = true

[dependencies.bytemuck]
version = "1"
optional = true
